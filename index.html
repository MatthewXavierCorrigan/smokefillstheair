<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoke Fills the Air</title>
<style>
  /* ============================================================
     Settings: change colours and sizes here
     ============================================================ */
  :root {
    --orange: #fe7b2c;  /* page background */
    --blue:   #0a5edc;  /* brand blue: logo + keyboard focus outline */
    --white:  #ffffff;  /* text + lines */
    --column: 680px;    /* widest the logo column and releases table can get */
    --line:   1px;      /* thickness of the lines in the releases table */
  }

  /* ============================================================
     Page (phones and tablets: one centred column)
     ============================================================ */
  * { box-sizing: border-box; }

  html {
    background: var(--orange);
    color: var(--white);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(32px, 8vh, 88px) clamp(16px, 4vw, 64px) clamp(20px, 4vh, 36px);
  }

  header, main { width: min(var(--column), 100%); }

  a { color: var(--white); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 4px; }
  a:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }

  /* ============================================================
     Logo (never narrower than 350px)
     ============================================================ */
  .logo {
    margin: 0;
    /* on very small screens, let the logo reach past the page margins */
    margin-inline: min(0px, calc((100% - 350px) / 2));
  }
  .logo img { display: block; width: 100%; height: auto; }

  /* ============================================================
     Copy
     ============================================================ */
  .copy { margin-top: clamp(32px, 6vh, 56px); }
  .copy p { margin: 0 0 1em; }

  /* ============================================================
     Releases table
     ============================================================ */
  .releases {
    width: 100%;
    margin-top: clamp(32px, 6vh, 56px);
    border-collapse: separate;
    border-spacing: 0;
    font-variant-numeric: tabular-nums;
  }
  .releases th,
  .releases td {
    padding: 1.4em 1em 0.3em 0;
    border-bottom: var(--line) solid var(--white);
    text-align: left;
    vertical-align: bottom;
  }
  .releases th {
    padding-top: 0;
    padding-bottom: 4px;
    font-size: 14px;
    line-height: 20px;
    font-weight: 400;
  }
  .releases .cat { font-weight: 700; white-space: nowrap; }
  .releases .date { padding-right: 0; text-align: right; white-space: nowrap; }
  .releases td a {
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 4px;
  }

  /* Phones: each release becomes a small block
       SMOKE-001          2026-11-13
       artist
       title                              */
  @media (max-width: 600px) {
    .releases thead {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }
    .releases tr {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "cat    date"
        "artist artist"
        "title  title";
      padding: 1.4em 0 0.3em;
      border-bottom: var(--line) solid var(--white);
    }
    .releases td { padding: 0; border: 0; }
    .releases .cat    { grid-area: cat; }
    .releases .artist { grid-area: artist; }
    .releases .title  { grid-area: title; }
    .releases .date   { grid-area: date; }
  }

  /* ============================================================
     Footer: contact + Instagram
     ============================================================ */
  footer {
    margin-top: auto;
    padding-top: clamp(48px, 9vh, 96px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .contact {
    margin: 0;
    font-size: clamp(15px, 1.4vw, 18px);
    letter-spacing: 0.04em;
    text-align: center;
  }
  .contact a { white-space: nowrap; }
  .instagram {
    display: flex;
    width: 44px;
    height: 44px;
    align-items: center;
    justify-content: center;
  }

  /* ============================================================
     Mailing list (Mailchimp)
     Sits under the releases table and copies its look: a small
     label over a line, then one row with the email box and button
     ============================================================ */
  .signup { margin-top: clamp(32px, 6vh, 56px); }
  .signup form { margin: 0; }

  /* same size and spacing as the table's column headings */
  .signup-label {
    display: block;
    padding-bottom: 4px;
    border-bottom: var(--line) solid var(--white);
    font-size: 14px;
    line-height: 20px;
  }

  .signup-row { display: flex; align-items: flex-start; }
  .signup-row .mc-field-group { flex: 1 1 auto; min-width: 0; }

  /* the email box and button are exactly as tall as a table row,
     so their text sits on the same baseline as the releases */
  .signup-email,
  .signup-button {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    height: calc(3.15em + var(--line));
    margin: 0;
    padding: 1.4em 0 0.3em;
    border: 0;
    border-bottom: var(--line) solid var(--white);
    border-radius: 0;
    background: transparent;
    color: var(--white);
    font: inherit;
    line-height: normal;
  }
  .signup-email { width: 100%; outline: none; }
  .signup-email::placeholder { color: var(--white); opacity: 0.6; }

  /* underlined like the release title links */
  .signup-button {
    padding-left: 1em;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 4px;
  }
  .signup-button:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }

  /* typing in the box: the row's line turns into a blue line like the logo's */
  .signup-email:focus {
    border-bottom: 2px solid var(--blue);
    padding-bottom: calc(0.3em + var(--line) - 2px);
  }
  .signup-row:has(.signup-email:focus) .signup-button {
    border-bottom: 2px solid var(--blue);
    padding-bottom: calc(0.3em + var(--line) - 2px);
  }

  /* stop Chrome and Safari painting a pale box over a remembered email */
  .signup-email:-webkit-autofill,
  .signup-email:-webkit-autofill:hover,
  .signup-email:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--white);
    caret-color: var(--white);
    -webkit-box-shadow: 0 0 0 1000px var(--orange) inset;
    transition: background-color 0s 600000s, color 0s 600000s;
  }

  /* Mailchimp's messages ("Please enter a valid email address.",
     "Thank you for subscribing!"): heading-sized, same white */
  .signup div.mce_inline_error,
  .signup #mce_tmp_error_msg,
  .signup .response {
    margin: 10px 0 0;
    padding: 0;
    background: none;
    color: var(--white);
    font-size: 14px;
    font-weight: 400;
    line-height: 20px;
  }
  .signup .response a,
  .signup #mce_tmp_error_msg a { text-decoration: underline; text-underline-offset: 3px; }

  /* ============================================================
     Desktop: releases on the left; logo, copy and contact on the right
     ============================================================ */
  @media (min-width: 1200px) {
    body {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, var(--column)));
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "releases intro"
        "releases footer";
      justify-content: space-between;
      align-items: start;
      column-gap: clamp(48px, 6vw, 120px);
      /* on very wide screens, stop the two columns drifting further apart */
      padding-inline: max(clamp(16px, 4vw, 64px), calc((100% - 1600px) / 2));
    }
    header { grid-area: intro;    width: auto; }
    main   { grid-area: releases; width: auto; }
    footer { grid-area: footer; align-self: end; }

    /* Puts the table's top line level with the line under SMOKE in the logo.
       7.17% = how far down the logo that line sits (as a share of its width);
       24.5px = how far down the table that line sits (heading height). */
    .releases { margin-top: calc(7.17% - 24.5px); }

    /* Puts the line under the email box level with the line under AIR in the logo.
       59.25% = how far down the logo that line sits (as a share of its width);
       82.2px = how far down the signup that line sits (label + one row).
       If the releases list grows past that point, the signup simply follows it. */
    main { display: grid; }
    main::before { content: ""; grid-area: 1 / 1; padding-top: calc(59.25% - 82.2px); }
    .releases { grid-area: 1 / 1; align-self: start; margin-bottom: clamp(48px, 8vh, 80px); }
    .signup { grid-area: 2 / 1; margin-top: 0; }
  }
</style>
</head>
<body>

<header>
  <h1 class="logo">
    <img src="assets/sfta-text-logo-blue.svg" alt="Smoke Fills the Air" width="5276" height="3248">
  </h1>

  <section class="copy">
    <blockquote><p>“I know there’s no other world / mountains and websites”</p><cite>Mount Eerie - Through the Trees Pt. 2</cite></blockquote>
  </section>

<main>

      </tr>
    </thead>
    <tbody>
      <tr>

      </tr>
      <tr>

        <td class="title">—</td>
        <td class="date"><time datetime="2027">2027</time></td>
      </tr>
    </tbody>
  </table>

  <!-- MAILING LIST: signups go straight to your Mailchimp audience. -->
  <section class="signup" id="mc_embed_signup">

          <input class="signup-email required email" type="email" name="EMAIL" id="mce-EMAIL" required value="" placeholder="email address" autocomplete="email" spellcheck="false" autocapitalize="off">
        </div>
        <button class="signup-button" type="submit" name="subscribe" id="mc-embedded-subscribe">subscribe</button>
      </div>
      <!-- bot trap: people never see this, it catches spam signups. Don't remove it. -->
      <div style="position: absolute; left: -5000px;" aria-hidden="true">
        <input type="text" name="b_f7ceae5160042b74026309663_3e0a19b11e" tabindex="-1" value="">
      </div>

</main>

<footer>

  <a class="instagram" href="https://www.instagram.com/smokefillstheair/" target="_blank" rel="noopener" aria-label="Instagram">

<!-- Mailchimp's form checker. It brings its own copy of jQuery; the field list is
     only set up once it has loaded, which avoids "jQuery is not defined".
     If it's blocked, the form still works: it opens Mailchimp in a new tab. -->

      if (!window.jQuery) return;
      (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';fnames[5]='BIRTHDAY';ftypes[5]='birthday';fnames[6]='COMPANY';ftypes[6]='text';}(window.jQuery));
      window.$mcj = window.jQuery.noConflict(true);
    }
    var s = document.createElement('script');
    s.src = 'https://s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js';
    s.onload = mcInit;
    document.body.appendChild(s);
  })();
</script>
